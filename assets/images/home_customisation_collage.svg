<svg xmlns="http://www.w3.org/2000/svg" width="420" height="272" viewBox="0 0 420 272" fill="none">
  <title>A Home arranged around your music</title>
  <desc>A collage of album cards, an artwork feature and a compact catalog list.</desc>
  <!-- Decorative, font-free artwork. Neutral surfaces with berry and brass album art. -->
  <circle cx="211" cy="137" r="110" stroke="#CDC9BE" stroke-opacity=".12"/>
  <circle cx="211" cy="137" r="130" stroke="#CDC9BE" stroke-opacity=".07" stroke-dasharray="3 8"/>
  <path d="M24 132h12m-6-6v12M374 74h12m-6-6v12M358 234h8m-4-4v8" stroke="#CDC9BE" stroke-width="1.5" stroke-linecap="round" opacity=".6"/>
  <circle cx="69" cy="231" r="3" fill="#D8556A"/>
  <circle cx="345" cy="26" r="2.5" fill="#CDC9BE"/>

  <!-- A tilted artwork feature: abstract sun, mountain and record grooves. -->
  <g transform="translate(32 29) rotate(-7 112 52)">
    <rect width="224" height="104" rx="12" fill="#0E0E0E" stroke="#323235"/>
    <rect x="10" y="10" width="84" height="84" rx="7" fill="#CDC9BE"/>
    <circle cx="66" cy="38" r="18" fill="#C2394B"/>
    <path d="M10 76 44 39 94 94H17a7 7 0 0 1-7-7Z" fill="#323235"/>
    <path d="m41 94 32-38 21 25v6a7 7 0 0 1-7 7Z" fill="#858585"/>
    <rect x="109" y="28" width="86" height="6" rx="3" fill="#FAF5F0" fill-opacity=".8"/>
    <rect x="109" y="42" width="67" height="4" rx="2" fill="#858585"/>
    <rect x="109" y="52" width="78" height="4" rx="2" fill="#858585" fill-opacity=".5"/>
    <circle cx="119" cy="77" r="10" fill="#222220"/>
    <path d="m117 73 6 4-6 4Z" fill="#CDC9BE"/>
    <path d="M138 77h39" stroke="#858585" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- The main shelf: three different album covers, each with its caption. -->
  <g transform="translate(95 87) rotate(4 143 66)">
    <rect width="286" height="140" rx="12" fill="#1C1C1A" stroke="#858585" stroke-opacity=".5"/>
    <rect x="14" y="14" width="79" height="5" rx="2.5" fill="#FAF5F0"/>
    <path d="M254 16h16m-4-4 4 4-4 4" stroke="#A3A3A3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="14" y="30" width="78" height="78" rx="6" fill="#250708"/>
    <circle cx="53" cy="69" r="30" fill="#C2394B"/>
    <circle cx="53" cy="69" r="24" stroke="#F59299" stroke-opacity=".5"/>
    <circle cx="53" cy="69" r="18" stroke="#F59299" stroke-opacity=".5"/>
    <circle cx="53" cy="69" r="10" fill="#250708"/>
    <circle cx="53" cy="69" r="3" fill="#CDC9BE"/>

    <rect x="104" y="30" width="78" height="78" rx="6" fill="#CDC9BE"/>
    <path d="M104 67c12-28 25 28 39 0s25 28 39 0M104 79c12-28 25 28 39 0s25 28 39 0M104 91c12-28 25 28 39 0s25 28 39 0" stroke="#323235" stroke-width="4"/>
    <circle cx="163" cy="46" r="7" fill="#858585"/>

    <rect x="194" y="30" width="78" height="78" rx="6" fill="#323235"/>
    <path d="m208 97 19-56h11l-19 56Zm24 0 19-56h7l-19 56Z" fill="#CDC9BE"/>
    <circle cx="218" cy="49" r="9" fill="#D8556A"/>
    <g fill="#A3A3A3">
      <rect x="14" y="116" width="57" height="4" rx="2"/>
      <rect x="104" y="116" width="62" height="4" rx="2"/>
      <rect x="194" y="116" width="49" height="4" rx="2"/>
    </g>
    <g fill="#858585" fill-opacity=".5">
      <rect x="14" y="125" width="36" height="3" rx="1.5"/>
      <rect x="104" y="125" width="41" height="3" rx="1.5"/>
      <rect x="194" y="125" width="33" height="3" rx="1.5"/>
    </g>
  </g>

  <!-- A smaller list floats over the shelf to suggest mix-and-match layouts. -->
  <g transform="translate(35 171) rotate(-4 87 42)">
    <rect width="174" height="84" rx="10" fill="#151513" stroke="#858585" stroke-opacity=".6"/>
    <rect x="12" y="12" width="67" height="4" rx="2" fill="#FAF5F0" fill-opacity=".8"/>
    <rect x="12" y="26" width="19" height="19" rx="4" fill="#CDC9BE"/>
    <circle cx="21.5" cy="35.5" r="5" fill="#323235"/>
    <rect x="41" y="29" width="86" height="4" rx="2" fill="#A3A3A3"/>
    <rect x="41" y="37" width="60" height="3" rx="1.5" fill="#858585" fill-opacity=".5"/>
    <rect x="12" y="54" width="19" height="19" rx="4" fill="#323235"/>
    <path d="m15 70 6-12 7 12Z" fill="#D8556A"/>
    <rect x="41" y="57" width="73" height="4" rx="2" fill="#A3A3A3"/>
    <rect x="41" y="65" width="51" height="3" rx="1.5" fill="#858585" fill-opacity=".5"/>
    <path d="m151 32 3 3-3 3m0 22 3 3-3 3" stroke="#A3A3A3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
