<svg xmlns="http://www.w3.org/2000/svg" width="512" height="288" viewBox="0 0 512 288" fill="none">
  <title>Arrange your Home</title>
  <desc>Search, collections and sources stay fixed at the top of Home. Pinned catalog sections below can be rearranged and displayed as cards or lists.</desc>
  <!-- Transparent, font-free vector. All colour comes from currentColor.
       Flutter: SvgPicture.asset('assets/images/home_layout_diagram.svg',
         theme: SvgTheme(currentColor: tint)).
       A ColorFilter with BlendMode.srcIn also tints the whole asset.
       Named groups separate the frame, fixed sections, pinned sections and
       reorder arrows for optional individual recolouring. Keep any visible
       explanatory caption in the app so it can be localised. -->

  <g id="home-frame" stroke="currentColor" stroke-width="1.5" opacity="0.26">
    <rect x="96" y="8" width="288" height="272" rx="18"/>
    <path d="M116 120H364" stroke-dasharray="3 5"/>
  </g>

  <g id="fixed-sections" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" opacity="0.44">
    <!-- Search -->
    <rect x="116" y="24" width="248" height="24" rx="12"/>
    <circle cx="132" cy="35" r="4"/>
    <path d="m135 38 3 3"/>
    <path d="M149 36H239" stroke-width="3"/>
    <path d="M346 33l3 3-3 3"/>

    <!-- Collections -->
    <path d="M121 61h10v11h-10zM125 58h10v10"/>
    <path d="M149 62H224M149 71H194" stroke-width="3"/>
    <path d="M343 65h9M347.5 60.5v9"/>

    <!-- Sources -->
    <rect x="116" y="88" width="120" height="20" rx="6"/>
    <rect x="244" y="88" width="120" height="20" rx="6"/>
    <path d="M129 101V94l5-1v6M132 101a2 2 0 1 1-4 0M137 99a2 2 0 1 1-4 0" stroke-width="1.3"/>
    <path d="M257 95h4l2 2h8v7h-14z" stroke-width="1.3"/>
    <path d="M147 98H209M281 98H337" stroke-width="3"/>

    <!-- The lock applies only to the fixed sections above. -->
    <path d="M394 65h12" stroke-dasharray="2 4"/>
    <rect x="413" y="63" width="14" height="12" rx="3"/>
    <path d="M416 63v-4a4 4 0 0 1 8 0v4"/>
    <path d="M420 68v2"/>
  </g>

  <g id="pinned-cards" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <rect x="116" y="132" width="248" height="64" rx="10" fill="currentColor" fill-opacity="0.045" stroke-width="1.75"/>
    <path d="M130 140h8l-1 6 3 3h-12l3-3zM134 149v5" stroke-width="1.4"/>
    <path d="M151 144H244" stroke-width="3" opacity="0.8"/>
    <g fill="currentColor" fill-opacity="0.13" stroke-opacity="0.65" stroke-width="1.25">
      <rect x="128" y="158" width="48" height="24" rx="4"/>
      <rect x="186" y="158" width="48" height="24" rx="4"/>
      <rect x="244" y="158" width="48" height="24" rx="4"/>
      <rect x="302" y="158" width="48" height="24" rx="4"/>
    </g>
    <path d="M129 187h30M187 187h34M245 187h28M303 187h36" stroke-width="2" opacity="0.6"/>
    <g fill="currentColor" stroke="none" opacity="0.6">
      <circle cx="104" cy="158" r="1.2"/><circle cx="108" cy="158" r="1.2"/>
      <circle cx="104" cy="164" r="1.2"/><circle cx="108" cy="164" r="1.2"/>
      <circle cx="104" cy="170" r="1.2"/><circle cx="108" cy="170" r="1.2"/>
    </g>
  </g>

  <g id="pinned-list" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <rect x="116" y="208" width="248" height="56" rx="10" fill="currentColor" fill-opacity="0.045" stroke-width="1.75"/>
    <path d="M130 216h8l-1 6 3 3h-12l3-3zM134 225v5" stroke-width="1.4"/>
    <path d="M151 220H218" stroke-width="3" opacity="0.8"/>
    <g fill="currentColor" stroke="none" opacity="0.6">
      <rect x="129" y="233" width="3" height="3" rx="1"/>
      <rect x="129" y="239" width="3" height="3" rx="1"/>
      <rect x="129" y="245" width="3" height="3" rx="1"/>
      <rect x="129" y="251" width="3" height="3" rx="1"/>
      <rect x="129" y="257" width="3" height="3" rx="1"/>
      <circle cx="104" cy="230" r="1.2"/><circle cx="108" cy="230" r="1.2"/>
      <circle cx="104" cy="236" r="1.2"/><circle cx="108" cy="236" r="1.2"/>
      <circle cx="104" cy="242" r="1.2"/><circle cx="108" cy="242" r="1.2"/>
    </g>
    <path d="M140 234.5H264M140 240.5H300M140 246.5H277M140 252.5H290M140 258.5H254" stroke-width="2" opacity="0.6"/>
  </g>

  <g id="reorder-arrows" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M374 164H401M374 236H401" stroke-width="1.5" stroke-dasharray="2 5" opacity="0.4"/>
    <path d="M420 154v92M412 162l8-8 8 8M412 238l8 8 8-8" stroke-width="2.5"/>
  </g>
</svg>
